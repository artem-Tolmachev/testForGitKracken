<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="product-info__item">
            <h2 class="product-info__subtitle">Quantitity</h2>
            <div class="stepper">
                <button class="btn-reset stepper__btn--disable stepper__btn stepper__btn--minus" aria-label="decrease quantity">-</button>
                <input  type="number" value="1" min="1" max="15"  class="stepper__input">
                <button class="btn-reset stepper__btn stepper__btn--plus" aria-label="increase quantity">+</button>
            </div>
        </div>
    </header>
    <script src="./index.js"></script>
</body>
</html>
